name: (Reusable) Build Android Release and deploy to DeployGate

on:
  workflow_call:
    inputs:
      version_code:
        description: 'AndroidのversionCode(未指定時はGradleの既定値を使う)'
        required: false
        type: string
      message:
        description: 'DeployGateのリリースノート'
        required: false
        type: string
        default: 'CI配信'

jobs:
  deploy:
    name: Build and deploy to DeployGate
    runs-on: ubuntu-latest
    environment: deploygate
    concurrency:
      group: deploygate-android-deploy
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain
        with:
          working-directory: app
          java: 'true'
          ruby: 'true'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json

      - name: Write app/.env (EXPO_PUBLIC_API_URL)
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          # 未設定のままビルドすると config.ts の既定値 http://localhost:3000 が
          # JSバンドルに焼き込まれ、実機からは自分自身を指すため必ず疎通できなくなる。
          # 気づかれないまま配信されるのを防ぐため、未設定時はここで明示的に失敗させる。
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::vars.EXPO_PUBLIC_API_URL が未設定です。開発サーバーへ疎通できるngrok等の固定URLを" \
                 "'gh variable set EXPO_PUBLIC_API_URL --repo <repo> --env deploygate' で登録してください。"
            exit 1
          fi
          echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL" > app/.env

      - name: Build and deploy to DeployGate
        working-directory: app/android
        env:
          DEPLOYGATE_API_TOKEN: ${{ secrets.DEPLOYGATE_API_TOKEN }}
          DEPLOYGATE_USER: ${{ secrets.DEPLOYGATE_USER }}
          VERSION_CODE: ${{ inputs.version_code }}
          MESSAGE: ${{ inputs.message }}
        run: |
          if [ -n "$VERSION_CODE" ]; then
            bundle exec fastlane android publish_deploygate version_code:"$VERSION_CODE" message:"$MESSAGE"
          else
            bundle exec fastlane android publish_deploygate message:"$MESSAGE"
          fi
